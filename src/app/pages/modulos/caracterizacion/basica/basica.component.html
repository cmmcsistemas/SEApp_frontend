
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Formulario de registro</h2>
    <p class="text-center text-gray-500 mb-6">Preguntas contestadas, {{ contador }}  de {{ totalPasos}}</p>

    <form [formGroup]="caracterizacionForm" class="space-y-3">
    <div *ngIf="pasoActual === 1">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-4">
        <div >
          <label for="nombre" class="block text-gray-700"></label>
          <input type="text" id="nombre" formControlName="nombre" placeholder="Nombre" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
        </div>
        <div >
          <label for="apellido" class="block text-gray-700"></label>
          <input type="text" id="apellido" formControlName="apellido" placeholder="Apellido" class="mt-1 text-gray-500 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
        <div>
        <label for="nacionalidad" class="block text-gray-700">Nacionalidad</label>
          <select id="nacionalidad" formControlName="nacionalidad" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>País</option>
            <option *ngFor="let pais of paises" [value]="pais">{{ pais }}</option>
          </select>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-2 gap-6">
          <div>
            <label for="fechaNacimiento" class="block text-gray-700">Fecha de nacimiento.</label>
            <input type="date" id="fechaNacimiento" formControlName="fechaNacimiento"  class="mt-1 text-gray-500 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
        <div>
          <label for="estadoCivil" class="block text-gray-700">Estado civil</label>
            <select id="estadoCivil" formControlName="estadoCivil" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>Seleccione</option>
            <option *ngFor="let estadoCivil of estadosCivil" [value]="estadoCivil">{{ estadoCivil }}</option>
          </select>
        </div>
        </div>

      </div>
    <div class="grid grid-cols-2 md:grid-cols-2 gap-6 mb-4">
      <div class="grid grid-cols-2 md:grid-cols-2 gap-6">
        <div>
          <label for="tipoDocumento" class="block text-gray-700"></label>
          <select id="tipoDocumento" formControlName="tipoDocumento" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>Tipo documento</option>
            <option *ngFor="let tipo of tiposDocumento" [value]="tipo">{{ tipo }}</option>
          </select>
        </div>
        <div>
          <label for="noDocumento" class="block text-gray-700"></label>
          <input type="text" id="noDocumento" formControlName="noDocumento" placeholder="No. documento" class="mt-1 text-gray-500 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
        </div>
      </div>
        <div class="grid grid-cols-2 md:grid-cols-2 gap-6">
          <div>
            <label for="dptoExpedicion" class="block text-gray-700"></label>
            <input type="text" id="dptoExpedicion" formControlName="dptoExpedicion" placeholder="Departamento de expedición" class="mt-1 text-gray-500 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
          <div>
            <label for="ciudadExpedicion" class="block text-gray-700"></label>
          <input
          type="text"
          id="ciudadExpedicion"
          formControlName="ciudadExpedicion"
          placeholder="Ciudad de expedición"
          list="municipios-list"
          (input)="onInputChange($event)"
          class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500"
          >
          <datalist id="municipios-list">
            <option *ngFor="let expedida of municipiosFiltrados" [value]="expedida"></option>
          </datalist>

          </div>
        </div>

    </div>

    <div class="grid grid-cols-2 md:grid-cols-2 gap-6 mb-4">
         <div>
          <label for="grupoParticipante" class="block text-gray-700"></label>
          <select id="grupoParticipante" formControlName="grupoParticipante" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>Grupo del participante</option>
            <option *ngFor="let tipo of grupoParticipante" [value]="tipo">{{ tipo }}</option>
          </select>
        </div>
        <div>
          <label for="proyecto" class="block text-gray-700"></label>
            <select id="proyecto" formControlName="proyecto" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
             <option class="text-gray-500" value="" disabled selected>Seleccione un proyecto</option>
              <option *ngFor="let proyecto of proyectos" [value]="proyecto">{{ proyecto }}</option>
            </select>
        </div>
      </div>
  </div>
  <div *ngIf="pasoActual === 2">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
        <div>
          <label for="email" class="block text-gray-700"></label>
          <input type="email" id="email" formControlName="email"  placeholder="Correo" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
        </div>
        <div>
            <label for="paisResidencia" class="block text-gray-700"></label>
            <select id="paisResidencia" formControlName="paisResidencia" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>País de residencia</option>
            <option *ngFor="let paisResidencia of paises" [value]="paisResidencia">{{ paisResidencia }}</option>
          </select>
          </div>
        </div>

        <div *ngIf="caracterizacionForm.get('paisResidencia')?.value === 'COLOMBIA'" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
        <div>
           <label for="departamentoResidencia" class="block text-gray-700">Departamento</label>
            <select id="departamentoResidencia" formControlName="departamentoResidencia" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>Departamento</option>
            <option *ngFor="let departamentoResidencia of departamentos" [value]="departamentoResidencia">{{ departamentoResidencia }}</option>
            </select>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-2 gap-6">
          <div>
                     <label for="municipioResidencia" class="block text-gray-700">Municipio de residencia</label>
          <input
          type="text"
          id="municipioResidencia"
          formControlName="municipioResidencia"
          placeholder="Digite y busque un municipio"
          list="municipios-list"
          (input)="onMunicipioInputChange($event)"
          class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500"
          >
          <datalist id="municipios-list">
            <option *ngFor="let municipio of municipiosFiltrados" [value]="municipio"></option>
          </datalist>
          </div>
          <div>
            <label for="localidad" class="block text-gray-700">Localidad</label>
            <input type="text" id="localidad" formControlName="localidad" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
        </div>

        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
        <div>
          <label for="entornoResidencia" class="block text-gray-700">Entorno de residencia</label>
          <select id="entornoResidencia" formControlName="entornoResidencia" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          <option class="text-gray-500" value="" disabled selected>RURAL / URBANO</option>
          <option *ngFor="let tipo of entornosResidencia" [value]="tipo">{{ tipo }}</option>
          </select>
        </div>
        <div>
          <label for="direccion" class="block text-gray-700">Dirección</label>
          <input type="text" id="direccion" formControlName="direccion" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
        </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
          <div>
            <label for="numeroCelular" class="block text-gray-700"></label>
            <input type="number" id="numeroCelular" formControlName="numeroCelular" placeholder="Número celular" class="text-gray-500 mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>

        </div>
    </div>

      <div *ngIf="pasoActual === 3">
        <div class="grid grid-cols-2 md:grid-cols-2 gap-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
          <div>
            <label for="genero" class="block text-gray-700"></label>
            <select id="genero" formControlName="genero" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>Género</option>
            <option class="text-gray-500" value="" selected *ngFor="let genero of generos" [value]="genero">{{ genero }}</option>
            </select>
          </div>
          <div>
            <label for="sexo" class="block text-gray-700"></label>
            <select id="sexo" formControlName="sexo" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>Sexo</option>
            <option class="text-gray-500" value=""  selected *ngFor="let tipo of sexos" [value]="tipo">{{ tipo }}</option>
            </select>
          </div>
          </div>
          <div>
            <label for="grupoVulnerable" class="block text-gray-700"></label>
            <select id="grupoVulnerable" formControlName="grupoVulnerable" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>Grupo o poblacional vulnerable</option>
            <option class="text-gray-500" value="" selected *ngFor="let grupoVulnerable of gruposVulnerables" [value]="grupoVulnerable">{{ grupoVulnerable }}</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
          <div>
            <label for="etnia" class="block text-gray-700"></label>
            <select id="etnia" formControlName="etnia" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>Etnia</option>
            <option class="text-gray-500" value="" selected *ngFor="let etnia of etnias" [value]="etnia">{{ etnia }}</option>
            </select>
          </div>
          <div>
            <label for="discapacidad" class="block text-gray-700"></label>
            <select id="discapacidad" formControlName="discapacidad" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>Condición de discapacidad</option>
            <option class="text-gray-500" value="" selected *ngFor="let discapacidad of discapacidades" [value]="discapacidad">{{ discapacidad }}</option>
            </select>
          </div>
        </div>


    </div>

      <div class="flex justify-between items-center mt-8">
        <button type="button" [style.visibility]="pasoActual > 1 ? 'visible' : 'hidden'" (click)="atras()" class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-800 transition-colors duration-200">
          Atrás
        </button>
        <button type="button" [style.visibility]="pasoActual === paginas ? 'visible' : 'hidden'"(click)="guardarProgreso()" class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-800 transition-colors duration-200">
          Guardar progreso
        </button>
        <button type="button" [style.visibility]="pasoActual < paginas ? 'visible' : 'hidden'" (click)="siguiente()" class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-800 transition-colors duration-200 ">
          Siguiente
        </button>
      </div>
    </form>
