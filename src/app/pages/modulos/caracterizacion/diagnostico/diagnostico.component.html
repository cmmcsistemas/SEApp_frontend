
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Formulario de Diagnóstico</h2>
    <p class="text-center text-gray-500 mb-6">Preguntas 1 a 10 de 30</p>
    <p class="text-center text-gray-500 mb-8">
      Paso {{ pasoActual }} de {{ totalPasos }}. Por favor, responde a todas las preguntas de esta sección.
    </p>

    <form [formGroup]="diagnosticoForm" (ngSubmit)="guardarDiagnostico()" class="space-y-8">

    <div *ngFor="let pregunta of preguntasPasoActual; let i = index" class="p-4 border-none rounded-lg bg-gray-50">

        <!-- Mostramos el texto de la pregunta -->
        <label class="block font-semibold text-gray-700 mb-3">
          {{ ((pasoActual - 1) * preguntasPorPaso) + i + 1 }}. {{ pregunta.texto }}
        </label>

        <!-- Contenedor para las opciones de respuesta (radio buttons) -->
        <div class="flex items-center space-x-6">
          <!--
            Iteramos sobre el array 'opciones' para crear los 3 radio buttons.
          -->
          <div *ngFor="let opcion of opciones" class="flex items-center">
            <input
              type="radio"
              [id]="'pregunta_' + pregunta.id + '_' + opcion"
              [value]="opcion"
              [formControlName]="'pregunta_' + pregunta.id"
              class="h-4 w-4 text-green-600 border-gray-300 focus:ring-green-500">
            <label [for]="'pregunta_' + pregunta.id + '_' + opcion" class="ml-2 block text-sm text-gray-900">
              {{ opcion }}
            </label>
          </div>
        </div>

        <!--
          (Opcional) Mensaje de error si la pregunta no ha sido respondida.
          Se muestra solo si el campo ha sido "tocado" y no es válido.
        -->
        <div *ngIf="diagnosticoForm.controls['pregunta_' + pregunta.id].invalid && diagnosticoForm.controls['pregunta_' + pregunta.id].touched"
            class="text-red-500 text-xs mt-1">
          Esta pregunta es obligatoria.
        </div>

    </div>

      <div class="flex justify-between items-center mt-8">
        <button type="button"
            (click)="atras()"
            *ngIf="pasoActual > 1"
            class="px-6 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition-colors duration-200">
          Atrás
        </button>
        <button type="submit"
        class="px-6 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition-colors duration-200">
          Guardar progreso
        </button>

        <button type="button"
            (click)="siguiente()"
            *ngIf="pasoActual < totalPasos"
            class="px-6 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition-colors duration-200">
          Siguiente
        </button>
      </div>
    </form>
