
    <!-- El router-outlet aquí mostrará el contenido del componente hijo -->
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Formulario de Idea de Negocio</h2>
    <p class="text-center text-gray-500 mb-6">Preguntas {{ (pasoActual - 1) * 10 + 1 }} a {{ pasoActual * 10 }} de 14</p>

    <form [formGroup]="ideaDeNegocioForm" class="space-y-6">
      <!-- Sección del formulario que cambia por cada paso -->
      <div *ngIf="pasoActual === 1">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-30 mb-4">
          <div>
            <label for="nombreUnidad" class="block text-gray-700">Nombre de la unidad de negocio</label>
            <input type="text" id="nombreUnidad" formControlName="nombreUnidad" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
          <div>
            <label for="dptoUbicacion" class="block text-gray-700">Departamento donde está ubicado su negocio</label>
            <select id="dptoUbicacion" formControlName="dptoUbicacion" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
              <option value="" disabled selected>Seleccione</option>
              <!-- Opciones del select -->
            </select>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-30 mb-4">
          <div>
            <label for="ciudadUbicacion" class="block text-gray-700">Ciudad donde está ubicado su negocio</label>
            <select id="ciudadUbicacion" formControlName="ciudadUbicacion" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
              <option value="" disabled selected>Seleccione</option>
              <!-- Opciones del select -->
            </select>
          </div>
          <div>
            <label for="localidadUbicacion" class="block text-gray-700">Localidad donde está ubicado su negocio</label>
            <select id="localidadUbicacion" formControlName="localidadUbicacion" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
              <option value="" disabled selected>Seleccione</option>
              <!-- Opciones del select -->
            </select>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-30 mb-4">
          <div>
            <label for="rotulo" class="block text-gray-700">Rótulo</label>
            <select id="rotulo" formControlName="rotulo" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
              <option value="" disabled selected>Seleccione</option>
              <!-- Opciones del select -->
            </select>
          </div>
          <div>
            <label for="direccion" class="block text-gray-700">Dirección</label>
            <input type="text" id="direccion" formControlName="direccion" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-30 mb-4">
          <div>
            <label for="indicativo" class="block text-gray-700">Indicativo</label>
            <select id="indicativo" formControlName="indicativo" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
              <option value="" disabled selected>Seleccione</option>
              <!-- Opciones del select -->
            </select>
          </div>
          <div>
            <label for="telefonoFijo" class="block text-gray-700">Teléfono fijo</label>
            <input type="text" id="telefonoFijo" formControlName="telefonoFijo" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
        </div>
      </div>

      <div *ngIf="pasoActual === 2">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-30 mb-4">
          <div>
            <label for="celular1" class="block text-gray-700">Celular 1</label>
            <input type="text" id="celular1" formControlName="celular1" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
          <div>
            <label for="celular2" class="block text-gray-700">Celular 2 (Opcional)</label>
            <input type="text" id="celular2" formControlName="celular2" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-30 mb-4">
          <div>
            <label for="email" class="block text-gray-700">E-mail</label>
            <input type="email" id="email" formControlName="email" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
          <div>
            <label for="paginaWeb" class="block text-gray-700">Página web</label>
            <input type="text" id="paginaWeb" formControlName="paginaWeb" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
        </div>
      </div>

      <div class="flex justify-between items-center mt-8">
        <button type="button" (click)="atras()" class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-800 transition-colors duration-200" [disabled]="pasoActual === 1">
          Atrás
        </button>
        <button type="button" (click)="guardarProgreso()" class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-800 transition-colors duration-200">
          Guardar progreso
        </button>
        <button type="button" (click)="siguiente()" class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-800 transition-colors duration-200" [disabled]="pasoActual === 2">
          Siguiente
        </button>
      </div>
    </form>
