
    <!-- El router-outlet aquí mostrará el contenido del componente hijo -->
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Formulario de Unidad de Negocio</h2>
    <p class="text-center text-gray-500 mb-6">Preguntas contestadas {{ contador}} de {{totalPasos}} </p>

    <form [formGroup]="unidadDeNegocioForm" class="space-y-6">
      <!-- Sección del formulario que cambia por cada paso -->
      <div *ngIf="pasoActual === 1">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-4">
          <div>
            <label for="nombreUnidad" class="block text-gray-700">Nombre de la unidad de negocio</label>
            <input type="text" id="nombreUnidad" formControlName="nombreUnidad" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
          <div>
            <label for="dptoUbicacion" class="block text-gray-700">Departamento donde está ubicado su negocio</label>
               <select id="dptoUbicacion" formControlName="dptoUbicacion" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>Seleccione</option>
            <option *ngFor="let dptoUbicacion of departamentos" [ngValue]="dptoUbicacion">{{ dptoUbicacion.nombre_departamento }}</option>
          </select>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-4">
          <div>
            <label for="ciudadUbicacion" class="block text-gray-700">Ciudad donde está ubicado su negocio</label>
               <select id="ciudadUbicacion" formControlName="ciudadUbicacion" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            <option class="text-gray-500" value="" disabled selected>Seleccione</option>
            <option *ngFor="let ciudadUbicacion of municipios" [ngValue]="ciudadUbicacion">{{ ciudadUbicacion.nombre_municipio }}</option>
          </select>
          </div>
          <div>
            <label for="localidadUbicacion" class="block text-gray-700">Localidad donde está ubicado su negocio</label>
              <div *ngIf="unidadDeNegocioForm.get('ciudadUbicacion')?.value?.nombre_municipio !== 'BOGOTA'"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-gray-100 text-gray-700">
                {{ unidadDeNegocioForm.get('localidadUbicacion')?.value || 'N/A' }}
              </div>
            <select *ngIf="unidadDeNegocioForm.get('ciudadUbicacion')?.value?.nombre_municipio === 'BOGOTA'" id="localidadUbicacion" formControlName="localidadUbicacion" class="mt-1 block w-full text-gray-500 border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
              <option class="text-gray-500" value="" disabled selected>Localidad</option>
              <option *ngFor="let localidadUbicacion of localidades" [value]="localidadUbicacion">{{ localidadUbicacion }}</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-4">

          <div>
            <label for="direccion" class="block text-gray-700">Dirección</label>
            <input type="text" id="direccion" formControlName="direccion" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
          <div>
            <label for="telefonoFijo" class="block text-gray-700">Teléfono fijo</label>
            <input type="number" id="telefonoFijo" formControlName="telefonoFijo" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
        </div>
      </div>

      <div *ngIf="pasoActual === 2">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-4">
          <div class="grid grid-cols-2 md:grid-cols-2 gap-6">
            <div>
              <label for="celular" class="block text-gray-700">Celular</label>
              <input type="number" id="celular" formControlName="celular" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            </div>
            <div>
              <label for="email" class="block text-gray-700">E-mail</label>
              <input type="email" id="email" formControlName="email" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            </div>
          </div>
          <div>
            <label for="paginaWeb" class="block text-gray-700">Página web</label>
            <input type="text" id="paginaWeb" formControlName="paginaWeb" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-4">
            <div>
              <label for="descripcionUnidad" class="block text-gray-700">Descripción de la unidad de negocio</label>
              <input type="text" id="descripcionUnidad" formControlName="descripcionUnidad" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            </div>
          <div class="grid grid-cols-2 md:grid-cols-2 gap-6">
            <div>
              <label for="listadoProducto" class="block text-gray-700">Listado de productos</label>
              <input type="text" id="listadoProducto" formControlName="listadoProducto" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            </div>
            <div>
              <label for="fechaCreacion" class="block text-gray-700">Fecha de creación</label>
              <input type="date" id="fechaCreacion" formControlName="fechaCreacion" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-green-500 focus:border-green-500">
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-between items-center mt-8">
        <button type="button" (click)="atras()" class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-800 transition-colors duration-200" [disabled]="pasoActual === 1">
          Atrás
        </button>
        <button type="button" (click)="guardarProgreso()" class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-800 transition-colors duration-200">
          Guardar progreso
        </button>
        <button type="button" (click)="siguiente()" class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-800 transition-colors duration-200" [disabled]="pasoActual === 2">
          Siguiente
        </button>
      </div>
    </form>
